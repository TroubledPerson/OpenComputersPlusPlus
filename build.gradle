plugins {
    id 'scala'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.64'
    id 'wtf.gofancy.fancygradle' version '1.1.+'
    id "com.matthewprenger.cursegradle" version "1.4.0"
    id 'com.modrinth.minotaur' version '2.8.7'
}

fancyGradle {
    patches {
        resources
        coremods
        codeChickenLib
        asm
    }
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Javadoc).configureEach { options.encoding = 'UTF-8' }

file "build.properties" withReader {
    def prop = new Properties()
    prop.load(it)
    ext.config = new ConfigSlurper().parse prop
}

version = "${mod_version}"
if (version.endsWith("-snapshot")) {
    version += "-" + (new Date().format('yyyyMMdd'))
}

group = config.mod.group
archivesBaseName = config.mod.name

def getGitRef() {
    if (!file('.git').exists()) return "258943363-ocpp"
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        def ref = stdout.toString().trim()
        return ref ? ref : "258943363-ocpp"
    } catch (Throwable e) {
        return "258943363-ocpp"
    }
}

version += "+" + getGitRef()

ext.simpleVersion = version
version = "MC${config.minecraft.version}-${project.version}"

minecraft {
    mappings channel: "${config.minecraft.mappings_channel}", version: "${config.minecraft.mappings_version}"

    runs {
        client {
            workingDirectory project.file('run')
            jvmArgs '-Dfml.coreMods.load=li.cil.oc.common.launch.TransformerLoader'

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            mods {
                opencomputers {
                    source sourceSets.main
                }
            }
        }
        server {
            jvmArgs '-Dfml.coreMods.load=li.cil.oc.common.launch.TransformerLoader'

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            mods {
                opencomputers {
                    source sourceSets.main
                }
            }
        }
    }

    accessTransformer = file('src/main/resources/oc_at.cfg')
}

task replaceSourceTokensScala(type: Sync) {
    // Captured filter values must participate in incremental invalidation.
    inputs.property('ocppVersionToken', mod_version.toString())
    inputs.property('ocppMinecraftVersionToken', config.minecraft.version.toString())
    filteringCharset = 'UTF-8'
    from sourceSets.main.scala
    filter { line -> line
            .replaceAll('@VERSION@', "${mod_version}")
            .replaceAll("/*@MCVERSIONDEP@*/", ", acceptedMinecraftVersions = \"[${config.minecraft.version}]\"") }
    into "$buildDir/srcReplaced/scala"
}

/* Do not pull this in on IDEA, as it changes the compiler's source path, making navigating to errors harder */
if (!System.getProperty('idea.active')) {
    compileScala {
        source = replaceSourceTokensScala.outputs
    }
}

compileScala {
    configure(scalaCompileOptions.forkOptions) {
        memoryMaximumSize = '1g'
    }
}

repositories {
    maven {
        name "MightyPirates"
        url "https://maven.cil.li/"
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        name "SquidDev" /* CC: Tweaked */
        url "https://squiddev.cc/maven/"
    }
    maven {
        name "CurseForge"
        url "https://minecraft.curseforge.com/api/maven/"
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    ivy {
        name 'asie dependency mirror'
        artifactPattern "https://asie.pl/javadeps/[module]-[revision](-[classifier]).[ext]"
        metadataSources {
            artifact()
        }
    }
}

configurations {
    embedded

    compileOnly.extendsFrom provided
    implementation.extendsFrom embedded
}

dependencies {
    // Compile-only copies; runtime clients load original checksum-pinned JARs in
    // a private loader. Never merge signed providers or replace Minecraft IO.
    compileOnly files(fileTree('network-libs') { include '*.jar'; exclude '*-sources.jar' })
    testImplementation files(fileTree('network-libs') { include '*.jar'; exclude '*-sources.jar' })
    minecraft "net.minecraftforge:forge:${config.minecraft.version}-${config.forge.version}"

    compileOnly fg.deobf("li.cil.tis3d:TIS-3D:${config.tis3d.version}") {
        exclude module: "jei_1.12"
    }
    compileOnly fg.deobf("com.mod-buildcraft:buildcraft-api:${config.buildcraft.version}")
    compileOnly fg.deobf("MCMultiPart2:MCMultiPart-exp:${config.mcmp.version}")
    provided fg.deobf("net.sengir.forestry:forestry_1.12.2:${config.forestry.version}") {
        exclude module: "jei_1.12"
    }
    compileOnly fg.deobf("net.industrial-craft:industrialcraft-2:${config.ic2.version}")
    compileOnly fg.deobf("mcp.mobius.waila:Hwyla:${config.hwyla.version}:api")
    /* compileOnly fg.deobf("dan200.computercraft:ComputerCraft:${config.cc.version}") */
    compileOnly fg.deobf("org.squiddev:cc-tweaked-1.12.2:${config.cctweaked.version}")
    compileOnly fg.deobf("charset:Charset:${config.charset.version}:api")
    compileOnly fg.deobf("curse.maven:cofh-core-69162:2920433") /* CoFHCore */
    compileOnly fg.deobf("curse.maven:ender-io-64578:3328811") /* Ender IO */
    compileOnly fg.deobf("curse.maven:railcraft-51195:2687757") /* Railcraft */

    provided fg.deobf("appeng:appliedenergistics2:${config.ae2.version}") {
        transitive = false
    }
    provided fg.deobf("extracells:ExtraCells:${config.extracells.version}:api")
    
    provided fg.deobf("mekanism:Mekanism:${config.mekanism.version}:api") {
        transitive = false
    }

    provided fg.deobf("codechicken:ForgeMultipart:${config.minecraft.version}-${config.forgemultipart.version}:universal") {
        exclude module: "jei_1.12"
        exclude module: "CodeChickenLib"
    }

    provided fg.deobf("codechicken:ChickenASM:${config.casm.version}")

    provided fg.deobf("mezz.jei:jei_${config.minecraft.version}:${config.jei.version}")
    provided fg.deobf("codechicken:CodeChickenLib:${config.minecraft.version}-${config.ccl.version}:universal")
    provided fg.deobf("codechicken:WR-CBE:${config.minecraft.version}-${config.wrcbe.version}:universal")

    provided fg.deobf("mrtjp:ProjectRed:${config.projred.version}:Base") {
        exclude module: "NotEnoughItems"
        exclude module: "CodeChickenLib"
        exclude module: "jei_1.12"
        exclude module: "ForgeMultipart"
    }

    provided fg.deobf("mrtjp:ProjectRed:${config.projred.version}:integration") {
        exclude module: "NotEnoughItems"
        exclude module: "CodeChickenLib"
        exclude module: "jei_1.12"
        exclude module: "ForgeMultipart"
    }

    provided fg.deobf("mrtjp:MrTJPCore:${config.mrtjpcore.version}:universal") {
        exclude module: "NotEnoughItems"
        exclude module: "CodeChickenLib"
        exclude module: "jei_1.12"
        exclude module: "ForgeMultipart"
    }

    embedded name: 'OC-LuaJ', version: '20220907.1', ext: 'jar'
    embedded name: 'OC-JNLua', version: '20230530.0', ext: 'jar'
    embedded name: 'OC-JNLua-Natives', version: '20220928.1', ext: 'jar'

    testImplementation("junit:junit:4.13.2")
    testImplementation("org.mockito:mockito-all:1.10.19")
    testImplementation("org.scalactic:scalactic_2.11:2.2.6")
    testImplementation("org.scalatest:scalatest_2.11:2.2.6")

    provided fg.deobf("codechicken:EnderStorage:${config.minecraft.version}-${config.enderstorage.version}:universal")
}

test {
    // Headless fixtures load untransformed OC optional interfaces. Reuse existing
    // declared APIs only here; Forge handles optional stripping in a real launch.
    classpath += configurations.provided
    systemProperty 'ocpp.sourceRoot', projectDir.absolutePath
    systemProperty 'ocpp.libraryDirectory', file('network-libs').absolutePath
    systemProperty 'ocpp.spriteSourceItems', file('src/main/resources/assets/opencomputers/textures/items').absolutePath
    systemProperty 'ocpp.spriteGenerated', file("$buildDir/generated/tier-style-v2").absolutePath
    exclude '**/PackagedClientTest*'
    exclude '**/PackagedAudioTest*'
    // Actual-JAR API2/legacy-addon isolation runs in the packaged suite below.
    exclude '**/PackagedApi2Test*'
}

tasks.register('oneJarTest', Test) {
    dependsOn testClasses
    dependsOn 'companionJar'
    mustRunAfter 'reobfJar'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/PackagedClientTest*'
    include '**/PackagedAudioTest*'
    include '**/PackagedApi2Test*'
    systemProperty 'ocpp.api2SourceRoot', projectDir.absolutePath
    maxHeapSize = '192m'
    systemProperty 'ocpp.packagedJar', project.findProperty('ocppPackagedJar') ?: tasks.jar.archiveFile.get().asFile.absolutePath
    systemProperty 'ocpp.originalLibraries', file('network-libs').absolutePath
    systemProperty 'ocpp.fixtureRoot', file("$buildDir/onejar-fixtures").absolutePath
    def legacyIo = fileTree(new File(gradle.gradleUserHomeDir, 'caches/modules-2/files-2.1/commons-io/commons-io/2.5')) { include '**/*.jar' }
    doFirst { systemProperty 'ocpp.legacyCommonsIo', legacyIo.singleFile.absolutePath }
}
// Optional developer-only classpath for a bounded Java-only loader rebuild.
// Default builds compile every source normally; this does not change runtime APIs.
if (project.hasProperty('ocppStagedLoader')) {
    tasks.withType(Test).configureEach { classpath = files(file(project.property('ocppStagedLoader'))) + classpath }
}
check.dependsOn tasks.named('oneJarTest')

// Reviewed pure-Java codecs. Complete upstream source/licenses are shipped in
// the matching source snapshot; nothing downloads or executes a player here.
def ocppJlayerJar = file(findProperty('ocppJlayerJar') ?: 'audio-libs/jlayer-1.0.1.jar')
def ocppFlacSource = file(findProperty('ocppFlacSource') ?: 'audio-libs/nayuki-java8-source')
tasks.register('compileFlacCodec', JavaCompile) {
    source fileTree(new File(ocppFlacSource,'src')) { include 'io/nayuki/flac/common/*.java', 'io/nayuki/flac/decode/*.java', 'io/nayuki/flac/encode/*.java' }
    destinationDirectory = file("$buildDir/audio-codecs/classes")
    classpath = files()
    sourceCompatibility = '1.8'; targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}
tasks.register('flacCodecJar', Jar) {
    dependsOn 'compileFlacCodec'
    archiveFileName = 'nayuki-flac-c9b8727b.jar'
    destinationDirectory = file("$buildDir/audio-codecs")
    preserveFileTimestamps = false; reproducibleFileOrder = true
    from tasks.named('compileFlacCodec').map { it.destinationDirectory }
    from(ocppFlacSource) { include 'COPYING*.txt'; into 'META-INF/licenses' }
}
dependencies {
    compileOnly files(ocppJlayerJar, tasks.named('flacCodecJar'))
    testImplementation files(ocppJlayerJar, tasks.named('flacCodecJar'))
}
compileJava.dependsOn 'flacCodecJar'
tasks.register('generateAudioRuntime') {
    dependsOn 'flacCodecJar'
    inputs.files(ocppJlayerJar, tasks.named('flacCodecJar'))
    inputs.files('audio-libs/LICENSE-JLayer-LGPL2.1.txt','audio-libs/nayuki-java8-source/COPYING.txt','audio-libs/nayuki-java8-source/COPYING.LESSER.txt')
    outputs.dir("$buildDir/generated/audio-runtime")
    doLast {
        def out = file("$buildDir/generated/audio-runtime/META-INF/ocpp-audio")
        out.mkdirs()
        def entries = ['jlayer-1.0.1.jar':ocppJlayerJar,'nayuki-flac-c9b8727b.jar':tasks.named('flacCodecJar').get().archiveFile.get().asFile]
        def props = new StringBuilder()
        entries.each { name,f ->
            copy { from f; into out; rename { name } }
            props.append(name).append('=').append(java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()).append('\n')
        }
        new File(out,'runtime.properties').setText(props.toString(),'UTF-8')
        copy { from 'audio-libs/LICENSE-JLayer-LGPL2.1.txt','audio-libs/nayuki-java8-source/COPYING.txt','audio-libs/nayuki-java8-source/COPYING.LESSER.txt'; into out }
    }
}
processResources {
    dependsOn 'generateAudioRuntime'
    from("$buildDir/generated/audio-runtime")
}
test {
    systemProperty 'ocpp.audioJlayer', ocppJlayerJar.absolutePath
    systemProperty 'ocpp.audioFlac', file("$buildDir/audio-codecs/nayuki-flac-c9b8727b.jar").absolutePath
}

tasks.register('generateTierSpriteLayers', JavaExec) {
    dependsOn compileJava
    classpath = files("$buildDir/classes/java/main")
    mainClass = 'li.cil.oc.plusplus.TierSpriteLayers'
    def originals = file('src/main/resources/assets/opencomputers/textures/items')
    inputs.files(fileTree(originals) { include 'cpu*.png', 'hdd*.png', 'graphicscard*.png', 'ram*.png', 'apu*.png', 'apu*.mcmeta', 'chip*.png' })
    inputs.file('src/main/java/li/cil/oc/plusplus/TierSpriteLayers.java')
    inputs.file('src/main/java/li/cil/oc/plusplus/StageOneSprites.java')
    inputs.file('src/main/java/li/cil/oc/plusplus/OpticalSprites.java')
    inputs.file('src/main/java/li/cil/oc/plusplus/SoundSprites.java')
    inputs.file('src/main/java/li/cil/oc/plusplus/NetworkSprites.java')
    inputs.file('src/main/java/li/cil/oc/plusplus/PreviewSprites.java')
    inputs.files(fileTree('src/main/resources/assets/opencomputers/textures/blocks') { include 'case_*.png', 'screen/*.png' })
    inputs.file('src/main/resources/assets/opencomputers/textures/items/internetcard.png')
    inputs.file('src/main/resources/assets/opencomputers/textures/items/lancard.png')
    inputs.file('src/main/resources/assets/opencomputers/textures/items/disk.png')
    inputs.file('src/main/resources/assets/opencomputers/textures/blocks/diskdrive_front.png')
    inputs.file('src/main/resources/assets/opencomputers/textures/gui/background.png')
    outputs.dir("$buildDir/generated/tier-style-v2")
    outputs.dir("$buildDir/tier-sprite-preview")
    args originals.absolutePath, file("$buildDir/generated/tier-style-v2").absolutePath, file("$buildDir/tier-sprite-preview").absolutePath
    jvmArgs '-Djava.awt.headless=true', "-Duser.home=${projectDir.parentFile}/build-home", "-Djava.io.tmpdir=${projectDir.parentFile}/build-temp"
}

processResources {
    dependsOn 'generateOpenOSMaster'
    from("$buildDir/generated/openos-master")
    dependsOn tasks.named('generateTierSpriteLayers')
    from("$buildDir/generated/tier-style-v2")
    filteringCharset = 'UTF-8'
    inputs.property "version", "${mod_version}"
    inputs.property "mcversion", config.minecraft.version
    inputs.property "fversion", config.forge.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching(['mcmod.info']) {
        expand 'version':"${mod_version}", 'mcversion':config.minecraft.version, 'fversion':config.forge.version
    }
    filesMatching(['application.conf']) {
        filter { line ->
            line.replaceAll("@VERSION@", "${mod_version}")
        }
    }

    // Move access transformer to META-INF
    rename '(.+_at.cfg)', 'META-INF/$1'
}

// Metadata only. No emulator, firmware, guest or host service is bundled/run.
tasks.register('generateOpenOSMaster', JavaExec) {
    dependsOn compileJava
    classpath = files("$buildDir/classes/java/main") + sourceSets.main.compileClasspath
    mainClass = 'li.cil.oc.plusplus.OpenOSMaster'
    inputs.dir('src/main/resources/assets/opencomputers/loot/openos')
    inputs.file('src/main/java/li/cil/oc/plusplus/OpenOSMaster.java')
    outputs.dir("$buildDir/generated/openos-master")
    args file('src/main/resources/assets/opencomputers/loot/openos').absolutePath,
        file("$buildDir/generated/openos-master/assets/opencomputers/openos-master.manifest").absolutePath
    jvmArgs '-Djava.awt.headless=true', "-Djava.io.tmpdir=${projectDir.parentFile}/build-temp"
}

sourceSets {
    companion {
        java.setSrcDirs(['src/companion/java'])
        resources.setSrcDirs(['src/companion/resources'])
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
}
tasks.named('compileCompanionJava') { dependsOn classes }
sourceSets.test.compileClasspath += sourceSets.companion.output
tasks.named('compileTestJava') { dependsOn companionClasses }
tasks.register('companionJar', Jar) {
    dependsOn companionClasses
    archiveFileName = 'OCVMIntegration-offline-dev.2.jar'
    destinationDirectory = file("$buildDir/libs")
    from sourceSets.companion.output
    from('LICENSE') { into 'META-INF' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
test {
    dependsOn companionClasses
    classpath += sourceSets.companion.output
}

jar {
    // Store original signed archives as data. Never flatten, relocate or strip
    // their manifests, service resources or signatures, or add them globally.
    from('network-libs') {
        include 'smbj-0.14.0.jar', 'commons-net-3.13.0.jar', 'bcprov-jdk18on-1.86.jar',
            'slf4j-api-2.0.9.jar', 'mbassador-1.3.0.jar', 'asn-one-0.6.0.jar',
            'commons-io-2.21.0.jar', 'THIRD-PARTY-NOTICES.txt'
        into 'META-INF/ocpp-runtime'
    }
    configurations.embedded.each { dep ->
        from(project.zipTree(dep)) {
            exclude 'META-INF', 'META-INF/**'
        }
    }
    manifest {
        attributes FMLCorePlugin: "li.cil.oc.common.launch.TransformerLoader"
        attributes FMLCorePluginContainsFMLMod: "true"
        attributes FMLAT: "oc_at.cfg"
    }
}

javadoc {
    include 'li/cil/oc/api/**'
}

task apiJar(type: Jar) {
    from sourceSets.main.allSource
    from sourceSets.main.output
    classifier = 'api'
    include 'li/cil/oc/api/**'
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    from javadoc.destinationDir
    classifier 'javadoc'
}

artifacts {
    archives apiJar
    archives javadocJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = project.name
            version = mod_version
            artifact jar
            artifact apiJar
            artifact javadocJar
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = System.getenv("GITHUB_MAVEN_URL") ?: ""
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

curseforge {
    apiKey = System.getenv('CURSEFORGE_API_KEY') ?: ""
    project {
        id = config.curse.project.id
        releaseType = System.getenv('CURSEFORGE_RELEASE_TYPE') ?: "alpha"
        changelogType = "markdown"
        changelog = System.getenv("CHANGELOG") ?: "Changelog not available."
        addGameVersion config.minecraft.version
        addGameVersion "Java 8"
        addGameVersion "Forge"
    }
}

modrinth {
    token = System.getenv("MODRINTH_API_KEY") ?: ""
    projectId = config.modrinth.project.id
    changelog = System.getenv("CHANGELOG") ?: "Changelog not available."
    versionNumber = mod_version
    versionName = "${rootProject.name}-${version}"
    versionType = System.getenv('MODRINTH_RELEASE_TYPE') ?: "alpha"
    uploadFile = jar
    gameVersions = [config.minecraft.version]
    loaders = ["forge"]
}

// Optional simulated QMP addon. Parallel source set preserves offline dev2 and main dev33.
sourceSets {
    companionSimulated {
        java.setSrcDirs(['src/companionSimulated/java'])
        resources.setSrcDirs(['src/companionSimulated/resources'])
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
}
tasks.named('compileCompanionSimulatedJava') { dependsOn classes }
sourceSets.test.compileClasspath += sourceSets.companionSimulated.output
sourceSets.test.runtimeClasspath += sourceSets.companionSimulated.output
tasks.named('compileTestJava') { dependsOn companionSimulatedClasses }
tasks.register('companionSimulatedJar', Jar) {
    dependsOn companionSimulatedClasses
    archiveFileName = 'OCVMIntegration-simulated-dev.3.jar'
    destinationDirectory = file("$buildDir/libs")
    from sourceSets.companionSimulated.output
    from('LICENSE') { into 'META-INF' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
test {
    dependsOn 'companionSimulatedJar'
    exclude '**/PackagedSimulatedAddonTest*'
}
tasks.named('oneJarTest') {
    dependsOn 'companionSimulatedJar'
    include '**/PackagedSimulatedAddonTest*'
    systemProperty 'ocpp.simulatedAddon', tasks.named('companionSimulatedJar').get().archiveFile.get().asFile.absolutePath
}

// Test tasks capture their classpath before the later parallel source set exists.
// Add it explicitly to both actual task classpaths, not only SourceSet metadata.
tasks.named('test') { classpath += sourceSets.companionSimulated.output }
tasks.named('oneJarTest') { classpath += sourceSets.companionSimulated.output }

// Configuration export only: no test/build/native task dependencies or actions.
tasks.register('exportSimulatedTestModel') {
    doLast {
        def model = [:]
        ['test','oneJarTest'].each { name ->
            def selected = tasks.named(name).get()
            def properties = [:]
            selected.systemProperties.each { key, value ->
                if (key.toString().startsWith('ocpp.') || key.toString() == 'java.awt.headless') properties[key.toString()] = value.toString()
            }
            if (name == 'oneJarTest') {
                def legacy = fileTree(new File(gradle.gradleUserHomeDir,'caches/modules-2/files-2.1/commons-io/commons-io/2.5')) { include '**/*.jar' }
                properties['ocpp.legacyCommonsIo'] = legacy.singleFile.absolutePath
            }
            model[name] = [classpath: selected.classpath.files.collect { it.absolutePath }, classesDirs: selected.testClassesDirs.files.collect { it.absolutePath }, properties: properties, jvmArgs: selected.jvmArgs.collect { it.toString() }, maxHeapSize: selected.maxHeapSize, includes: selected.includes.toList(), excludes: selected.excludes.toList()]
        }
        println 'QMP_TEST_MODEL=' + groovy.json.JsonOutput.toJson(model)
    }
}

// Public source snapshot: upstream service publishing is deliberately disabled.
tasks.matching { it.name.startsWith('publish') || it.name.startsWith('curseforge') || it.name.startsWith('modrinth') }.configureEach { enabled = false }
