{
  "name": "Normal-project Forge configuration boundary probe",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "expected_sha": {
          "description": "Exact reviewed source commit",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "forge-plugin-local-guard",
    "cancel-in-progress": false
  },
  "jobs": {
    "qualify": {
      "if": "github.repository == 'TroubledPerson/OpenComputersPlusPlus' && github.ref == 'refs/heads/ocpp-dev33' && github.event_name == 'workflow_dispatch' && github.actor_id == '89006981' && inputs.expected_sha == github.sha && github.workflow_sha == github.sha",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "id": "source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961",
          "with": {
            "distribution": "temurin",
            "java-version": "8"
          }
        },
        {
          "name": "Qualify normal Forge configuration boundary",
          "env": {
            "EXPECTED_SOURCE_SHA": "${{ inputs.expected_sha }}"
          },
          "run": "python3 -B - <<'PY'\nimport importlib.util,json,os,pathlib,re,shutil,signal,subprocess,sys,time\nassert os.environ.get('GITHUB_ACTIONS')=='true'\nassert os.environ.get('RUNNER_ENVIRONMENT')=='github-hosted'\nassert 'OCPP_FORGE_INPUT_URL' not in os.environ\nsha=os.environ['EXPECTED_SOURCE_SHA']\nassert re.fullmatch('[0-9a-f]{40}',sha) and sha==os.environ['GITHUB_SHA']\npath=pathlib.Path('qualification/forge-input/runner.py')\nimport hashlib\nassert hashlib.sha256(path.read_bytes()).hexdigest()=='19936c6ee14034ed50e39d4b6db009748a866c8d6815aa137f5fafd2ef10daff'\nspec=importlib.util.spec_from_file_location('qualified_tooling',path)\nm=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)\np=m.root();peaks={'rss':0,'temp':0};phase='public-preparation'\ndef admission():\n    info=dict(s.split(':',1) for s in pathlib.Path('/proc/meminfo').read_text().splitlines())\n    assert int(info['MemAvailable'].split()[0])*1024>=2147483648\n    assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free>=3221225472\ndef rss(pid):\n    seen=set();todo=[pid];total=0\n    while todo:\n        n=todo.pop()\n        if n in seen:continue\n        seen.add(n)\n        try:\n            fields=pathlib.Path('/proc/'+str(n)+'/status').read_text().splitlines()\n            total+=next((int(s.split()[1])*1024 for s in fields if s.startswith('VmRSS:')),0)\n            todo.extend(int(x) for x in pathlib.Path('/proc/'+str(n)+'/task/'+str(n)+'/children').read_text().split())\n        except (FileNotFoundError,ProcessLookupError):pass\n    return total\ndef run(root,project,home,task,extra=(),env=None):\n    admission()\n    log=root/('guard-'+project.name+'.log')\n    child=dict(os.environ if env is None else env,JAVA_OPTS='-Xmx64m')\n    cmd=[str(root/'gradle-7.6.6/bin/gradle'),'-p',str(project),'-g',str(home),'--no-daemon','--max-workers=1','--console=plain','--stacktrace','-Dorg.gradle.jvmargs=-Xmx512m',*extra,task]\n    with log.open('xb') as out:\n        proc=subprocess.Popen(cmd,env=child,stdout=out,stderr=subprocess.STDOUT,start_new_session=True)\n        deadline=time.monotonic()+240;last=0\n        try:\n            while proc.poll() is None:\n                used=rss(proc.pid);peaks['rss']=max(peaks['rss'],used)\n                info=dict(s.split(':',1) for s in pathlib.Path('/proc/meminfo').read_text().splitlines())\n                assert used<=1073741824 and int(info['MemAvailable'].split()[0])*1024>=1073741824\n                assert time.monotonic()<deadline\n                if time.monotonic()-last>2:\n                    size=0\n                    for f in root.rglob('*'):\n                        try:\n                            if f.is_file():size+=f.stat().st_size\n                        except FileNotFoundError:pass\n                    peaks['temp']=max(peaks['temp'],size);assert size<=2147483648;last=time.monotonic()\n                time.sleep(.5)\n        except BaseException:\n            try:os.killpg(proc.pid,signal.SIGTERM)\n            except ProcessLookupError:pass\n            try:proc.wait(timeout=10)\n            except subprocess.TimeoutExpired:\n                os.killpg(proc.pid,signal.SIGKILL);proc.wait(timeout=10)\n            raise\n        if proc.returncode:raise subprocess.CalledProcessError(proc.returncode,cmd)\n\nSAFE_WORDS=set('a an the of to for from with is not cannot could must be has have class interface constructor constructors public private protected argument arguments parameter parameters type types instance instantiate instantiation create creation generate generated abstract final static method methods inject injection ambiguous multiple no suitable found unsupported version major invalid expected actual incompatible duplicate visibility accessible access required service services'.split())\ndef safe_message(raw):\n    raw=raw[:2048]\n    raw=re.sub(r'[A-Za-z][A-Za-z0-9+.-]*://\\S+|(?:[A-Za-z]:)?[\\\\/]\\S+|[\\'\"][^\\'\"]*[\\'\"]',' REDACTED ',raw)\n    parts=[]\n    for word in re.findall(r'[A-Za-z]+|[^A-Za-z]+',raw):\n        if word.isalpha():parts.append(word.lower() if word.lower() in SAFE_WORDS else '<redacted>')\n        else:parts.append(re.sub(r'[^ \\t(),:]+','<redacted>',word))\n    return re.sub(r'(?:<redacted>\\s*)+','<redacted> ',''.join(parts))[:384]\ndef early_failure(log):\n    if not log.is_file():return {'category':'NO_RESULT_NO_LOG'}\n    with log.open('rb') as stream:\n        stream.seek(0,2);end=stream.tell();stream.seek(max(0,end-8192))\n        tail=stream.read(8192).decode('utf-8','replace')\n    tail=re.sub(r'\\x1b\\[[0-?]*[ -/]*[@-~]','',tail)\n    selected=[line for line in tail.splitlines() if line.startswith(('Caused by:','> '))]\n    return {'category':'NO_RESULT_EARLY_FAILURE','sanitizedMessages':[safe_message(line) for line in selected[-4:]],'tailWasBounded':end>8192}\n\nm.admission=admission;m.gradle=run\n\ninit=json.loads(r'''\"import groovy.json.JsonOutput\\nclass ConfigurationFence extends SecurityManager {\\n String phase='self-test'\\n final List events=[]\\n void event(String kind) {\\n  synchronized(events) { if(events.size()<16) events.add([phase:phase,kind:kind,origin:(Thread.currentThread().stackTrace.any { it.className=='net.minecraftforge.gradle.common.util.MavenArtifactDownloader' } ? 'forge-downloader' : 'other')]) }\\n }\\n void checkConnect(String host,int port) { event('network');throw new SecurityException('PROBE_NETWORK_DENIED') }\\n void checkConnect(String host,int port,Object context) { checkConnect(host,port) }\\n void checkListen(int port) { event('listen');throw new SecurityException('PROBE_LISTEN_DENIED') }\\n void checkAccept(String host,int port) { event('accept');throw new SecurityException('PROBE_ACCEPT_DENIED') }\\n void checkMulticast(java.net.InetAddress address) { event('multicast');throw new SecurityException('PROBE_MULTICAST_DENIED') }\\n void checkExec(String cmd) { event('process');throw new SecurityException('PROBE_PROCESS_DENIED') }\\n void checkLink(String lib) { event('native');throw new SecurityException('PROBE_NATIVE_DENIED') }\\n void checkPermission(java.security.Permission p) {\\n  if(p instanceof java.net.SocketPermission) { event('network');throw new SecurityException('PROBE_SOCKET_PERMISSION_DENIED') }\\n  if(p instanceof RuntimePermission && p.name=='setSecurityManager') throw new SecurityException('PROBE_REPLACEMENT_DENIED')\\n }\\n}\\nassert System.getProperty('java.specification.version')=='1.8'\\nassert System.getSecurityManager()==null\\ndef fence=new ConfigurationFence()\\nSystem.setSecurityManager(fence)\\ngradle.buildFinished { result ->\\n def actual=fence.events.findAll { it.phase!='self-test' }\\n def complete=System.getProperty('ocpp.probe.deferred')=='true'\\n def record=[pluginApplied:System.getProperty('ocpp.probe.applied')=='true',\\n  deferredComplete:complete,configurationTask:System.getProperty('ocpp.probe.task')=='true',\\n  events:fence.events,guardRetained:System.getSecurityManager().is(fence),\\n  outcome:(!actual.empty ? 'BOUNDARY_BLOCKED' : result.failure!=null ? 'CONFIGURATION_FAILED' : complete ? 'CONFIGURATION_COMPLETE' : 'INCOMPLETE')]\\n new File(System.getenv('PROBE_RESULT')).text=JsonOutput.toJson(record)\\n}\\nint checks=0\\ndef probes=[\\n { new Socket('127.0.0.1',9).close() },\\n { new URL('http://127.0.0.1:9/').openConnection(Proxy.NO_PROXY).inputStream.close() },\\n { new URL('https://127.0.0.1:9/').openConnection(Proxy.NO_PROXY).inputStream.close() }]\\nprobes.each { probe ->\\n int before=fence.events.size()\\n try { probe();assert false } catch(SecurityException expected) {\\n  assert fence.events.size()>before && fence.events.last().kind=='network';checks++\\n }\\n}\\ntry { System.setSecurityManager(null);assert false } catch(SecurityException expected) { }\\nassert checks==3 && System.getSecurityManager().is(fence)\\nfence.phase='configuration'\\ngradle.projectsEvaluated { System.setProperty('ocpp.probe.deferred','true') }\\ngradle.taskGraph.whenReady { graph ->\\n assert graph.allTasks.collect { it.path }==[':qualifyForgeConfiguration']\\n}\\n\"''')\nbuild=json.loads(r'''\"buildscript {\\n dependencies { classpath files(System.getenv('PROBE_CP').split(File.pathSeparator)) }\\n}\\napply plugin: net.minecraftforge.gradle.userdev.UserDevPlugin\\nSystem.setProperty('ocpp.probe.applied','true')\\nminecraft { mappings channel:'stable',version:'39-1.12' }\\ndependencies { minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860' }\\ntasks.register('qualifyForgeConfiguration') {\\n doLast { System.setProperty('ocpp.probe.task','true') }\\n}\\n\"''')\n\ntry:\n    m.prepare(p)\n    phase='normal-forge-configuration'\n    project=p/'forge-control';project.mkdir()\n    (project/'settings.gradle').write_text(\"rootProject.name='forge-configuration-control'\\n\")\n    (project/'build.gradle').write_text(build)\n    guard=p/'configuration-guard.gradle';guard.write_text(init)\n    status=p/'configuration-result.json'\n    env=dict(os.environ,PROBE_CP=os.pathsep.join(m.checked_cp(p)),PROBE_RESULT=str(status))\n    exit_ok=True\n    try:\n        run(p,project,p/'forge-home','qualifyForgeConfiguration',('--offline','--init-script',str(guard)),env)\n    except subprocess.CalledProcessError:\n        exit_ok=False\n    if not status.is_file() or status.stat().st_size>4096:\n        print(json.dumps(early_failure(p/'guard-forge-control.log'),sort_keys=True))\n        raise RuntimeError('NO_BOUNDED_RESULT')\n    result=json.loads(status.read_text())\n    assert result['outcome'] in ['BOUNDARY_BLOCKED','CONFIGURATION_FAILED','CONFIGURATION_COMPLETE','INCOMPLETE']\n    assert all(e['phase'] in ['self-test','configuration'] and e['kind'] in ['network','listen','accept','multicast','process','native'] for e in result['events'])\n    assert all(e['origin'] in ['forge-downloader','other'] for e in result['events'])\n    assert result['guardRetained']\n    report=json.dumps({'scope':'normal-project Forge configuration only','exitOK':exit_ok,'result':result,'peaks':peaks},sort_keys=True)\n    assert len(report.encode())<=6144 and not re.search(r'https?://|[A-Z]:\\\\',report,re.I)\n    assert os.environ['RUNNER_TEMP'] not in report and os.environ['GITHUB_WORKSPACE'] not in report\n    print(report)\n    assert exit_ok and result['outcome']=='CONFIGURATION_COMPLETE' and result['configurationTask']\nexcept Exception as error:\n    print(json.dumps({'scope':'normal-project Forge configuration only','failedPhase':phase,'errorClass':type(error).__name__,'peaks':peaks},sort_keys=True))\n    sys.exit(1)\n\nPY\n"
        },
        {
          "name": "Remove owned fixture inputs caches and logs",
          "if": "always() && steps.source.outcome == 'success'",
          "run": "python3 -B qualification/forge-input/runner.py cleanup"
        }
      ]
    }
  }
}
