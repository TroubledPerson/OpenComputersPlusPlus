{
  "name": "Normal Gradle Java-plugin configuration control",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "expected_sha": {
          "description": "Exact reviewed source commit",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "forge-plugin-local-guard",
    "cancel-in-progress": false
  },
  "jobs": {
    "qualify": {
      "if": "github.repository == 'TroubledPerson/OpenComputersPlusPlus' && github.ref == 'refs/heads/ocpp-dev33' && github.event_name == 'workflow_dispatch' && github.actor_id == '89006981' && inputs.expected_sha == github.sha && github.workflow_sha == github.sha",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "id": "source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961",
          "with": {
            "distribution": "temurin",
            "java-version": "8"
          }
        },
        {
          "name": "Qualify normal Java plugin configuration",
          "env": {
            "EXPECTED_SOURCE_SHA": "${{ inputs.expected_sha }}"
          },
          "run": "python3 -B - <<'PY'\nimport importlib.util,json,os,pathlib,re,shutil,signal,subprocess,sys,time,urllib.request,urllib.parse\nassert os.environ.get('GITHUB_ACTIONS')=='true'\nassert os.environ.get('RUNNER_ENVIRONMENT')=='github-hosted'\nassert 'OCPP_FORGE_INPUT_URL' not in os.environ\nsha=os.environ['EXPECTED_SOURCE_SHA']\nassert re.fullmatch('[0-9a-f]{40}',sha) and sha==os.environ['GITHUB_SHA']\npath=pathlib.Path('qualification/forge-input/runner.py')\nimport hashlib\nassert hashlib.sha256(path.read_bytes()).hexdigest()=='19936c6ee14034ed50e39d4b6db009748a866c8d6815aa137f5fafd2ef10daff'\nspec=importlib.util.spec_from_file_location('qualified_tooling',path)\nm=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)\np=m.root();peaks={'rss':0,'temp':0};phase='public-distribution'\ndef admission():\n    info=dict(s.split(':',1) for s in pathlib.Path('/proc/meminfo').read_text().splitlines())\n    assert int(info['MemAvailable'].split()[0])*1024>=2147483648\n    assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free>=3221225472\ndef rss(pid):\n    seen=set();todo=[pid];total=0\n    while todo:\n        n=todo.pop()\n        if n in seen:continue\n        seen.add(n)\n        try:\n            fields=pathlib.Path('/proc/'+str(n)+'/status').read_text().splitlines()\n            total+=next((int(s.split()[1])*1024 for s in fields if s.startswith('VmRSS:')),0)\n            todo.extend(int(x) for x in pathlib.Path('/proc/'+str(n)+'/task/'+str(n)+'/children').read_text().split())\n        except (FileNotFoundError,ProcessLookupError):pass\n    return total\ndef run(root,project,home,task,extra=(),env=None):\n    admission()\n    log=root/('guard-'+project.name+'.log')\n    child=dict(os.environ if env is None else env,JAVA_OPTS='-Xmx64m')\n    cmd=[str(root/'gradle-7.6.6/bin/gradle'),'-p',str(project),'-g',str(home),'--no-daemon','--max-workers=1','--console=plain','--stacktrace','-Dorg.gradle.jvmargs=-Xmx512m',*extra,task]\n    with log.open('xb') as out:\n        proc=subprocess.Popen(cmd,env=child,stdout=out,stderr=subprocess.STDOUT,start_new_session=True)\n        deadline=time.monotonic()+240;last=0\n        try:\n            while proc.poll() is None:\n                used=rss(proc.pid);peaks['rss']=max(peaks['rss'],used)\n                info=dict(s.split(':',1) for s in pathlib.Path('/proc/meminfo').read_text().splitlines())\n                assert used<=1073741824 and int(info['MemAvailable'].split()[0])*1024>=1073741824\n                assert time.monotonic()<deadline\n                if time.monotonic()-last>2:\n                    size=0\n                    for f in root.rglob('*'):\n                        try:\n                            if f.is_file():size+=f.stat().st_size\n                        except FileNotFoundError:pass\n                    peaks['temp']=max(peaks['temp'],size);assert size<=2147483648;last=time.monotonic()\n                time.sleep(.5)\n        except BaseException:\n            try:os.killpg(proc.pid,signal.SIGTERM)\n            except ProcessLookupError:pass\n            try:proc.wait(timeout=10)\n            except subprocess.TimeoutExpired:\n                os.killpg(proc.pid,signal.SIGKILL);proc.wait(timeout=10)\n            raise\n        if proc.returncode:raise subprocess.CalledProcessError(proc.returncode,cmd)\n\nSAFE_WORDS=set('a an the of to for from with is not cannot could must be has have class interface constructor constructors public private protected argument arguments parameter parameters type types instance instantiate instantiation create creation generate generated abstract final static method methods inject injection ambiguous multiple no suitable found unsupported version major invalid expected actual incompatible duplicate visibility accessible access required service services'.split())\ndef safe_message(raw):\n    raw=raw[:2048]\n    raw=re.sub(r'[A-Za-z][A-Za-z0-9+.-]*://\\S+|(?:[A-Za-z]:)?[\\\\/]\\S+|[\\'\"][^\\'\"]*[\\'\"]',' REDACTED ',raw)\n    parts=[]\n    for word in re.findall(r'[A-Za-z]+|[^A-Za-z]+',raw):\n        if word.isalpha():parts.append(word.lower() if word.lower() in SAFE_WORDS else '<redacted>')\n        else:parts.append(re.sub(r'[^ \\t(),:]+','<redacted>',word))\n    return re.sub(r'(?:<redacted>\\s*)+','<redacted> ',''.join(parts))[:384]\ndef early_failure(log):\n    if not log.is_file():return {'category':'NO_RESULT_NO_LOG'}\n    with log.open('rb') as stream:\n        stream.seek(0,2);end=stream.tell();stream.seek(max(0,end-8192))\n        tail=stream.read(8192).decode('utf-8','replace')\n    tail=re.sub(r'\\x1b\\[[0-?]*[ -/]*[@-~]','',tail)\n    selected=[line for line in tail.splitlines() if line.startswith(('Caused by:','> '))]\n    return {'category':'NO_RESULT_EARLY_FAILURE','sanitizedMessages':[safe_message(line) for line in selected[-4:]],'tailWasBounded':end>8192}\n\ndef prepare_distribution():\n    admission();p.mkdir(mode=0o700)\n    with (p/'OWNER').open('xb') as marker:marker.write(m.ownership())\n    class HTTPSRedirect(urllib.request.HTTPRedirectHandler):\n        def redirect_request(self,req,fp,code,msg,headers,newurl):\n            assert urllib.parse.urlsplit(newurl).scheme=='https'\n            return super().redirect_request(req,fp,code,msg,headers,newurl)\n    opener=urllib.request.build_opener(HTTPSRedirect())\n    archive=p/'gradle.zip';h=hashlib.sha256();n=0;deadline=time.monotonic()+180\n    with opener.open('https://services.gradle.org/distributions/gradle-7.6.6-bin.zip',timeout=20) as response,archive.open('xb') as out:\n        while True:\n            assert time.monotonic()<deadline\n            b=response.read(1048576)\n            if not b:break\n            n+=len(b);assert n<=128439774;h.update(b);out.write(b)\n    assert n==128439774 and h.hexdigest()=='673d9776f303bc7048fc3329d232d6ebf1051b07893bd9d11616fad9a8673be0'\n    admission()\n    subprocess.run(['unzip','-q',str(archive),'-d',str(p)],check=True,timeout=60,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)\n    print('Pinned public Gradle distribution verified.')\n\ng=json.loads(r'''\"import groovy.json.JsonOutput\\nplugins { id 'java' }\\nassert gradle.gradleVersion=='7.6.6'\\nassert System.getProperty('java.specification.version')=='1.8'\\nassert plugins.hasPlugin('java')\\nassert extensions.findByName('java')!=null\\nassert extensions.findByName('sourceSets').names.containsAll(['main','test'])\\nassert tasks.names.contains('compileJava') && tasks.names.contains('test')\\ngradle.taskGraph.whenReady { graph ->\\n assert graph.allTasks.collect { it.path }==[':qualifyJavaConfiguration']\\n}\\ntasks.register('qualifyJavaConfiguration') {\\n doLast {\\n  def result=[javaPluginApplied:true,javaExtension:true,sourceSets:true,compileTaskRegistered:true,\\n   executedTasks:[':qualifyJavaConfiguration'],compilation:false,tests:false,\\n   forgeApplied:false,projectBuilder:false]\\n  file('result.json').text=JsonOutput.toJson(result)\\n }\\n}\\n\"''')\n\ntry:\n    prepare_distribution()\n    phase='normal-java-configuration'\n    project=p/'java-control';project.mkdir()\n    (project/'settings.gradle').write_text(\"rootProject.name='java-configuration-control'\\n\")\n    (project/'build.gradle').write_text(g)\n    try:\n        run(p,project,p/'control-home','qualifyJavaConfiguration',('--offline',))\n    except subprocess.CalledProcessError:\n        print(json.dumps(early_failure(p/'guard-java-control.log'),sort_keys=True))\n        raise\n    status=project/'result.json'\n    assert status.is_file() and status.stat().st_size<=1024\n    r=json.loads(status.read_text())\n    assert r=={'javaPluginApplied':True,'javaExtension':True,'sourceSets':True,'compileTaskRegistered':True,\n      'executedTasks':[':qualifyJavaConfiguration'],'compilation':False,'tests':False,\n      'forgeApplied':False,'projectBuilder':False}\n    report={'scope':'normal Gradle Java-plugin configuration only','result':r,'peaks':peaks}\n    text=json.dumps(report,sort_keys=True)\n    assert len(text.encode())<=2048 and not re.search(r'https?://|[A-Z]:\\\\',text,re.I)\n    assert os.environ['RUNNER_TEMP'] not in text and os.environ['GITHUB_WORKSPACE'] not in text\n    print(text)\nexcept Exception as error:\n    print(json.dumps({'scope':'normal Gradle Java-plugin configuration only','failedPhase':phase,\n      'errorClass':type(error).__name__,'peaks':peaks},sort_keys=True))\n    sys.exit(1)\n\nPY\n"
        },
        {
          "name": "Remove owned fixture inputs caches and logs",
          "if": "always() && steps.source.outcome == 'success'",
          "run": "python3 -B qualification/forge-input/runner.py cleanup"
        }
      ]
    }
  }
}
