{
  "name": "Plain Java guard startup qualification",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "expected_sha": {
          "description": "Exact reviewed source commit",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "forge-plugin-local-guard",
    "cancel-in-progress": false
  },
  "jobs": {
    "qualify": {
      "if": "github.repository == 'TroubledPerson/OpenComputersPlusPlus' && github.ref == 'refs/heads/ocpp-dev33' && github.event_name == 'workflow_dispatch' && github.actor_id == '89006981' && inputs.expected_sha == github.sha && github.workflow_sha == github.sha",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "id": "source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961",
          "with": {
            "distribution": "temurin",
            "java-version": "8"
          }
        },
        {
          "name": "Qualify guard startup without Forge",
          "env": {
            "EXPECTED_SOURCE_SHA": "${{ inputs.expected_sha }}"
          },
          "run": "python3 -B - <<'PY'\nimport importlib.util,json,os,pathlib,re,shutil,signal,subprocess,sys,time,ctypes,select\nassert os.environ.get('GITHUB_ACTIONS')=='true'\nassert os.environ.get('RUNNER_ENVIRONMENT')=='github-hosted'\nassert 'OCPP_FORGE_INPUT_URL' not in os.environ\nsha=os.environ['EXPECTED_SOURCE_SHA']\nassert re.fullmatch('[0-9a-f]{40}',sha) and sha==os.environ['GITHUB_SHA']\npath=pathlib.Path('qualification/forge-input/runner.py')\nimport hashlib\nassert hashlib.sha256(path.read_bytes()).hexdigest()=='19936c6ee14034ed50e39d4b6db009748a866c8d6815aa137f5fafd2ef10daff'\nspec=importlib.util.spec_from_file_location('qualified_tooling',path)\nm=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)\np=m.root();peaks={'rss':0,'temp':0};phase='public-preparation'\ndef admission():\n    info=dict(s.split(':',1) for s in pathlib.Path('/proc/meminfo').read_text().splitlines())\n    assert int(info['MemAvailable'].split()[0])*1024>=2147483648\n    assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free>=3221225472\n\ndef enable_subreaper():\n    assert hasattr(os,'pidfd_open') and hasattr(signal,'pidfd_send_signal')\n    libc=ctypes.CDLL(None,use_errno=True)\n    prior=ctypes.c_int()\n    assert libc.prctl(37,ctypes.byref(prior),0,0,0)==0\n    assert libc.prctl(36,1,0,0,0)==0\n    check=ctypes.c_int()\n    assert libc.prctl(37,ctypes.byref(check),0,0,0)==0 and check.value==1\n    return libc,prior.value\ndef supervised(cmd,env,log,root):\n    libc,prior=enable_subreaper()\n    tracked={};counts={'peakTracked':0,'signals':0}\n    proc=None\n    def children(pid):\n        try:return [int(x) for x in pathlib.Path('/proc/'+str(pid)+'/task/'+str(pid)+'/children').read_text().split()]\n        except FileNotFoundError:return []\n    def identity(pid):\n        path=pathlib.Path('/proc/'+str(pid))\n        try:\n            stat=path.joinpath('stat').read_text().rsplit(')',1)[1].split()\n            return int(stat[1]),int(stat[19]),path.stat().st_uid\n        except FileNotFoundError:return None\n    def alive(item):return not select.select([item['fd']],[],[],0)[0]\n    def discover():\n        queue=[os.getpid()];seen=set()\n        while queue:\n            parent=queue.pop()\n            if parent in seen:continue\n            seen.add(parent)\n            for pid in children(parent):\n                token=identity(pid)\n                if token is None or token[0]!=parent:continue\n                assert token[2]==os.getuid()\n                old=tracked.get(pid)\n                if old is None or old['birth']!=token[1]:\n                    if old is not None:os.close(old['fd'])\n                    assert len(tracked)<128\n                    try:fd=os.pidfd_open(pid)\n                    except ProcessLookupError:continue\n                    confirm=identity(pid)\n                    if confirm is None or confirm[1:]!=token[1:]:\n                        os.close(fd);continue\n                    tracked[pid]={'fd':fd,'birth':token[1]}\n                queue.append(pid)\n        counts['peakTracked']=max(counts['peakTracked'],len(tracked))\n    def reap():\n        if proc is not None:proc.poll()\n        for pid in children(os.getpid()):\n            if proc is not None and pid==proc.pid:continue\n            try:os.waitpid(pid,os.WNOHANG)\n            except ChildProcessError:pass\n    def live():\n        return [(pid,item) for pid,item in tracked.items() if alive(item)]\n    def send(sig):\n        for pid,item in live():\n            try:signal.pidfd_send_signal(item['fd'],sig);counts['signals']+=1\n            except ProcessLookupError:pass\n    def sampled_rss():\n        used=0\n        for pid,item in live():\n            before=identity(pid)\n            if before is None or before[1]!=item['birth']:continue\n            try:\n                fields=pathlib.Path('/proc/'+str(pid)+'/status').read_text().splitlines()\n                value=next((int(x.split()[1])*1024 for x in fields if x.startswith('VmRSS:')),0)\n            except FileNotFoundError:continue\n            after=identity(pid)\n            if after is not None and after[1]==item['birth']:used+=value\n        peaks['rss']=max(peaks['rss'],used)\n        return used\n    def pressure():\n        info=dict(x.split(':',1) for x in pathlib.Path('/proc/meminfo').read_text().splitlines())\n        return sampled_rss()>1073741824 or int(info['MemAvailable'].split()[0])*1024<1073741824\n    def cleanup():\n        end=time.monotonic()+2\n        while time.monotonic()<end:\n            discover();reap()\n            if pressure():break\n            if not live() and not children(os.getpid()):break\n            time.sleep(.1)\n        for sig,seconds in ((signal.SIGTERM,5),(signal.SIGKILL,2)):\n            end=time.monotonic()+seconds\n            while time.monotonic()<end:\n                discover();send(signal.SIGKILL if pressure() else sig);reap()\n                if not live() and not children(os.getpid()):break\n                time.sleep(.1)\n            if not live() and not children(os.getpid()):break\n        if proc is not None:proc.wait(timeout=1)\n        discover();reap()\n        assert not live() and not children(os.getpid()),'OWNED_PROCESS_CLEANUP_INCOMPLETE'\n        counts['drained']=True\n    try:\n        assert not children(os.getpid()),'UNEXPECTED_PREEXISTING_CHILDREN'\n        with log.open('xb') as out:\n            proc=subprocess.Popen(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,start_new_session=True)\n            deadline=time.monotonic()+240;last=0\n            try:\n                while proc.poll() is None:\n                    discover()\n                    used=sampled_rss()\n                    info=dict(x.split(':',1) for x in pathlib.Path('/proc/meminfo').read_text().splitlines())\n                    assert used<=1073741824 and int(info['MemAvailable'].split()[0])*1024>=1073741824\n                    assert time.monotonic()<deadline\n                    if time.monotonic()-last>2:\n                        size=0\n                        for f in root.rglob('*'):\n                            try:\n                                if f.is_file():size+=f.stat().st_size\n                            except FileNotFoundError:pass\n                        peaks['temp']=max(peaks['temp'],size);assert size<=2147483648;last=time.monotonic()\n                    time.sleep(.25)\n            finally:\n                cleanup()\n        return proc.returncode,counts\n    finally:\n        try:\n            for item in tracked.values():os.close(item['fd'])\n        finally:\n            if not children(os.getpid()):\n                assert libc.prctl(36,prior,0,0,0)==0\n            else:raise RuntimeError('OWNED_PROCESS_CLEANUP_INCOMPLETE')\nsupervision_selftested=False\ndef run(root,project,home,task,extra=(),env=None):\n    global supervision_selftested\n    admission()\n    child=dict(os.environ if env is None else env,JAVA_OPTS='-Xmx64m')\n    if not supervision_selftested:\n        fault=\"import os,time\\nr,w=os.pipe()\\np=os.fork()\\nif p==0:\\n os.close(r)\\n if os.fork()==0:\\n  os.write(w,b'1');os.close(w);time.sleep(30);os._exit(0)\\n os._exit(0)\\nos.close(w)\\nassert os.read(r,1)==b'1'\\nos.close(r)\\nos._exit(0)\\n\"\n        code,check=supervised([sys.executable,'-B','-c',fault],child,root/'owned-supervision-selftest.log',root)\n        assert code==0 and check['drained'] and check['signals']>0\n        supervision_selftested=True\n        print(json.dumps({'ownedSupervisionSelftest':True,'drained':True},sort_keys=True))\n    cmd=[str(root/'gradle-7.6.6/bin/gradle'),'-p',str(project),'-g',str(home),'--no-daemon','--max-workers=1','--console=plain','--stacktrace','-Dorg.gradle.jvmargs=-Xmx512m',*extra,task]\n    code,counts=supervised(cmd,child,root/('guard-'+project.name+'.log'),root)\n    print(json.dumps({'ownedProcessSupervision':counts},sort_keys=True))\n    if code:raise subprocess.CalledProcessError(code,cmd)\n\nSAFE_WORDS=set('a an the of to for from with is not cannot could must be has have class interface constructor constructors public private protected argument arguments parameter parameters type types instance instantiate instantiation create creation generate generated abstract final static method methods inject injection ambiguous multiple no suitable found unsupported version major invalid expected actual incompatible duplicate visibility accessible access required service services load library native initialize initialization security denied assertion failed self suppression'.split())\ndef safe_message(raw):\n    raw=raw[:2048]\n    raw=re.sub(r'[A-Za-z][A-Za-z0-9+.-]*://\\S+|(?:[A-Za-z]:)?[\\\\/]\\S+|[\\'\"][^\\'\"]*[\\'\"]',' REDACTED ',raw)\n    parts=[]\n    for word in re.findall(r'[A-Za-z]+|[^A-Za-z]+',raw):\n        if word.isalpha():parts.append(word.lower() if word.lower() in SAFE_WORDS else '<redacted>')\n        else:parts.append(re.sub(r'[^ \\t(),:]+','<redacted>',word))\n    return re.sub(r'(?:<redacted>\\s*)+','<redacted> ',''.join(parts))[:384]\ndef early_failure(log):\n    if not log.is_file():return {'category':'NO_RESULT_NO_LOG'}\n    with log.open('rb') as stream:\n        stream.seek(0,2);end=stream.tell();stream.seek(max(0,end-8192))\n        tail=stream.read(8192).decode('utf-8','replace')\n    tail=re.sub(r'\\x1b\\[[0-?]*[ -/]*[@-~]','',tail)\n    selected=[line for line in tail.splitlines() if line.startswith(('Caused by:','> '))]\n    categories=[name for name in ('StackOverflowError','SecurityException','AccessControlException','ExceptionInInitializerError','NoClassDefFoundError','MultipleCompilationErrorsException','IllegalArgumentException','UnsupportedOperationException','NullPointerException','UnsatisfiedLinkError','LinkageError','BootstrapMethodError','NoSuchMethodError','AssertionError') if name in tail]\n    progress=log.parent/'guard-progress'\n    stage=progress.read_text() if progress.is_file() and progress.stat().st_size<=64 else 'NO_PROGRESS'\n    assert stage in ('NO_PROGRESS','INIT_ENTERED','FENCE_CONSTRUCTED','CALLBACK_REGISTERED','FENCE_INSTALLED','SOCKET_PROBE','HTTP_PROBE','HTTPS_PROBE','SELFTESTS_PASSED')\n    return {'category':'NO_RESULT_EARLY_FAILURE','errorCategories':categories,'progress':stage,'sanitizedMessages':[safe_message(line) for line in selected[-4:]],'tailWasBounded':end>8192}\n\nm.admission=admission;m.gradle=run\n\njava=json.loads(r'''\"package ocpp.probe;\\nimport java.net.InetAddress;\\nimport java.net.SocketPermission;\\nimport java.security.Permission;\\nimport java.util.concurrent.atomic.AtomicIntegerArray;\\npublic final class ProbeFence extends SecurityManager {\\n    private static final SecurityException DENIED=new SecurityException(\\\"PROBE_DENIED\\\");\\n    private static final int WIDTH=7, LIMIT=1000000;\\n    private final AtomicIntegerArray counts=new AtomicIntegerArray(14);\\n    private volatile int phase;\\n    private volatile boolean blocked;\\n    public ProbeFence() {\\n        if (!\\\"1.8\\\".equals(System.getProperty(\\\"java.specification.version\\\")))\\n            throw new IllegalStateException(\\\"JAVA8_REQUIRED\\\");\\n        new SocketPermission(\\\"127.0.0.1:9\\\",\\\"connect,resolve\\\").getActions();\\n        new RuntimePermission(\\\"setSecurityManager\\\").getName();\\n        counts.compareAndSet(0,0,0);\\n        counts.get(0);\\n        \\\"setSecurityManager\\\".equals(\\\"\\\");\\n        DENIED.getMessage();\\n    }\\n    private void deny(int kind) {\\n        int current=phase;\\n        if (current==1) blocked=true;\\n        int index=current*WIDTH+kind;\\n        for (int attempt=0;attempt<16;attempt++) {\\n            int value=counts.get(index);\\n            if (value>=LIMIT || counts.compareAndSet(index,value,value+1)) break;\\n        }\\n        throw DENIED;\\n    }\\n    public int networkCount() { return counts.get(0); }\\n    public void configurationPhase() { phase=1; }\\n    public boolean configurationBlocked() { return blocked; }\\n    public int[] snapshot() {\\n        int[] result=new int[14];\\n        for (int i=0;i<14;i++) result[i]=counts.get(i);\\n        return result;\\n    }\\n    @Override public void checkConnect(String host,int port) { deny(0); }\\n    @Override public void checkConnect(String host,int port,Object context) { deny(0); }\\n    @Override public void checkListen(int port) { deny(1); }\\n    @Override public void checkAccept(String host,int port) { deny(2); }\\n    @Override public void checkMulticast(InetAddress address) { deny(3); }\\n    @Override public void checkMulticast(InetAddress address,byte ttl) { deny(3); }\\n    @Override public void checkExec(String command) { deny(4); }\\n    @Override public void checkLink(String library) { deny(5); }\\n    @Override public void checkPermission(Permission permission) {\\n        if (permission==null) deny(6);\\n        if (permission instanceof SocketPermission) deny(0);\\n        if (permission instanceof RuntimePermission &&\\n            (\\\"setSecurityManager\\\".equals(permission.getName()) ||\\n             \\\"createSecurityManager\\\".equals(permission.getName()))) deny(6);\\n    }\\n    @Override public void checkPermission(Permission permission,Object context) {\\n        checkPermission(permission);\\n    }\\n}\\n\"''')\ninit=json.loads(r'''\"initscript { dependencies { classpath files(System.getenv('PROBE_GUARD_CP')) } }\\nimport ocpp.probe.ProbeFence\\nimport groovy.json.JsonOutput\\ndef progress=new File(System.getenv('PROBE_PROGRESS'))\\nprogress.text='INIT_ENTERED'\\nassert System.getProperty('java.specification.version')=='1.8'\\nassert System.getSecurityManager()==null\\ndef fence=new ProbeFence()\\nprogress.text='FENCE_CONSTRUCTED'\\ngradle.buildFinished { result ->\\n def blocked=fence.configurationBlocked()\\n def complete=System.getProperty('ocpp.probe.deferred')=='true'\\n def record=[pluginApplied:System.getProperty('ocpp.probe.applied')=='true',\\n  deferredComplete:complete,configurationTask:System.getProperty('ocpp.probe.task')=='true',\\n  counts:fence.snapshot().toList(),guardHelperCompiled:true,projectCompilation:false,guardRetained:System.getSecurityManager().is(fence),\\n  outcome:(blocked ? 'BOUNDARY_BLOCKED' : result.failure!=null ? 'CONFIGURATION_FAILED' : complete ? 'GUARD_STARTUP_COMPLETE' : 'INCOMPLETE')]\\n new File(System.getenv('PROBE_RESULT')).text=JsonOutput.toJson(record)\\n}\\nprogress.text='CALLBACK_REGISTERED'\\nSystem.setSecurityManager(fence)\\nprogress.text='FENCE_INSTALLED'\\nint checks=0\\ndef probes=[\\n { new Socket('127.0.0.1',9).close() },\\n { new URL('http://127.0.0.1:9/').openConnection(Proxy.NO_PROXY).inputStream.close() },\\n { new URL('https://127.0.0.1:9/').openConnection(Proxy.NO_PROXY).inputStream.close() }]\\nprobes.eachWithIndex { probe,index ->\\n progress.text=['SOCKET_PROBE','HTTP_PROBE','HTTPS_PROBE'][index]\\n int before=fence.networkCount()\\n try { probe();assert false } catch(SecurityException expected) {\\n  assert fence.networkCount()>before;checks++\\n }\\n}\\ntry { System.setSecurityManager(null);assert false } catch(SecurityException expected) { }\\nassert checks==3 && System.getSecurityManager().is(fence)\\nprogress.text='SELFTESTS_PASSED'\\nfence.configurationPhase()\\ngradle.projectsEvaluated { System.setProperty('ocpp.probe.deferred','true') }\\ngradle.taskGraph.whenReady { graph ->\\n assert graph.allTasks.collect { it.path }==[':qualifyForgeConfiguration']\\n}\\n\"''')\nbuild=json.loads(r'''\"tasks.register('qualifyForgeConfiguration') {\\n doLast { System.setProperty('ocpp.probe.task','true') }\\n}\\n\"''')\n\ntry:\n    m.prepare(p)\n    phase='guard-helper-compilation'\n    source=p/'guard-src/ocpp/probe/ProbeFence.java';source.parent.mkdir(parents=True);source.write_text(java)\n    classes=p/'guard-classes';classes.mkdir()\n    javac=pathlib.Path(os.environ['JAVA_HOME'])/'bin/javac'\n    code,counts=supervised([str(javac),'-J-Xmx128m','-source','8','-target','8','-encoding','UTF-8','-d',str(classes),str(source)],dict(os.environ),p/'guard-javac.log',p)\n    print(json.dumps({'guardHelperCompilationExit':code,'ownedProcessSupervision':counts},sort_keys=True))\n    assert code==0\n    payload=(classes/'ocpp/probe/ProbeFence.class').read_bytes()\n    assert payload[:4]==b'\\xca\\xfe\\xba\\xbe' and int.from_bytes(payload[6:8],'big')==52\n    phase='guard-startup'\n    project=p/'forge-control';project.mkdir()\n    (project/'settings.gradle').write_text(\"rootProject.name='forge-configuration-control'\\n\")\n    (project/'build.gradle').write_text(build)\n    guard=p/'configuration-guard.gradle';guard.write_text(init)\n    status=p/'configuration-result.json'\n    env=dict(os.environ,PROBE_GUARD_CP=str(classes),PROBE_RESULT=str(status),PROBE_PROGRESS=str(p/'guard-progress'))\n    exit_ok=True\n    try:\n        run(p,project,p/'forge-home','qualifyForgeConfiguration',('--offline','--init-script',str(guard)),env)\n    except subprocess.CalledProcessError:\n        exit_ok=False\n    if not status.is_file() or status.stat().st_size>4096:\n        print(json.dumps(early_failure(p/'guard-forge-control.log'),sort_keys=True))\n        raise RuntimeError('NO_BOUNDED_RESULT')\n    result=json.loads(status.read_text())\n    assert result['outcome'] in ['BOUNDARY_BLOCKED','CONFIGURATION_FAILED','GUARD_STARTUP_COMPLETE','INCOMPLETE']\n    assert len(result['counts'])==14 and all(type(x) is int and 0<=x<=1000000 for x in result['counts'])\n    assert result['guardHelperCompiled'] and result['projectCompilation'] is False\n    assert result['guardRetained']\n    details={}\n    if not exit_ok or result['outcome']!='GUARD_STARTUP_COMPLETE':\n        details=early_failure(p/'guard-forge-control.log')\n        details['category']='INNER_FAILURE_DETAILS'\n    report=json.dumps({'scope':'guard startup only; no Forge application','exitOK':exit_ok,'result':result,'diagnostic':details,'peaks':peaks},sort_keys=True)\n    assert len(report.encode())<=6144 and not re.search(r'https?://|[A-Z]:\\\\',report,re.I)\n    assert os.environ['RUNNER_TEMP'] not in report and os.environ['GITHUB_WORKSPACE'] not in report\n    print(report)\n    assert exit_ok and result['outcome']=='GUARD_STARTUP_COMPLETE' and result['configurationTask']\nexcept Exception as error:\n    print(json.dumps({'scope':'guard startup only; no Forge application','failedPhase':phase,'errorClass':type(error).__name__,'peaks':peaks},sort_keys=True))\n    sys.exit(1)\n\nPY\n"
        },
        {
          "name": "Remove owned fixture inputs caches and logs",
          "if": "always() && steps.source.outcome == 'success'",
          "run": "python3 -B qualification/forge-input/runner.py cleanup"
        }
      ]
    }
  }
}
