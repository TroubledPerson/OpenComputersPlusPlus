{
  "name": "Forge plugin local-input guard",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "expected_sha": {
          "description": "Exact reviewed source commit",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "forge-plugin-local-guard",
    "cancel-in-progress": false
  },
  "jobs": {
    "qualify": {
      "if": "github.repository == 'TroubledPerson/OpenComputersPlusPlus' && github.ref == 'refs/heads/ocpp-dev33' && github.event_name == 'workflow_dispatch' && github.actor_id == '89006981' && inputs.expected_sha == github.sha && github.workflow_sha == github.sha",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "id": "source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961",
          "with": {
            "distribution": "temurin",
            "java-version": "8"
          }
        },
        {
          "name": "Qualify public mixed-repository guard",
          "env": {
            "EXPECTED_SOURCE_SHA": "${{ inputs.expected_sha }}"
          },
          "run": "python3 -B - <<'PY'\nimport importlib.util,json,os,pathlib,re,shutil,signal,subprocess,sys,time\nassert os.environ.get('GITHUB_ACTIONS')=='true'\nassert os.environ.get('RUNNER_ENVIRONMENT')=='github-hosted'\nassert 'OCPP_FORGE_INPUT_URL' not in os.environ\nsha=os.environ['EXPECTED_SOURCE_SHA']\nassert re.fullmatch('[0-9a-f]{40}',sha) and sha==os.environ['GITHUB_SHA']\npath=pathlib.Path('qualification/forge-input/runner.py')\nimport hashlib\nassert hashlib.sha256(path.read_bytes()).hexdigest()=='19936c6ee14034ed50e39d4b6db009748a866c8d6815aa137f5fafd2ef10daff'\nspec=importlib.util.spec_from_file_location('qualified_tooling',path)\nm=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)\np=m.root();peaks={'rss':0,'temp':0};phase='public-preparation'\ndef admission():\n    info=dict(s.split(':',1) for s in pathlib.Path('/proc/meminfo').read_text().splitlines())\n    assert int(info['MemAvailable'].split()[0])*1024>=2147483648\n    assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free>=3221225472\ndef rss(pid):\n    seen=set();todo=[pid];total=0\n    while todo:\n        n=todo.pop()\n        if n in seen:continue\n        seen.add(n)\n        try:\n            fields=pathlib.Path('/proc/'+str(n)+'/status').read_text().splitlines()\n            total+=next((int(s.split()[1])*1024 for s in fields if s.startswith('VmRSS:')),0)\n            todo.extend(int(x) for x in pathlib.Path('/proc/'+str(n)+'/task/'+str(n)+'/children').read_text().split())\n        except (FileNotFoundError,ProcessLookupError):pass\n    return total\ndef run(root,project,home,task,extra=(),env=None):\n    admission()\n    log=root/('guard-'+project.name+'.log')\n    child=dict(os.environ if env is None else env,JAVA_OPTS='-Xmx64m')\n    cmd=[str(root/'gradle-7.6.6/bin/gradle'),'-p',str(project),'-g',str(home),'--no-daemon','--max-workers=1','--console=plain','-Dorg.gradle.jvmargs=-Xmx512m',*extra,task]\n    with log.open('xb') as out:\n        proc=subprocess.Popen(cmd,env=child,stdout=out,stderr=subprocess.STDOUT,start_new_session=True)\n        deadline=time.monotonic()+240;last=0\n        try:\n            while proc.poll() is None:\n                used=rss(proc.pid);peaks['rss']=max(peaks['rss'],used)\n                info=dict(s.split(':',1) for s in pathlib.Path('/proc/meminfo').read_text().splitlines())\n                assert used<=1073741824 and int(info['MemAvailable'].split()[0])*1024>=1073741824\n                assert time.monotonic()<deadline\n                if time.monotonic()-last>2:\n                    size=0\n                    for f in root.rglob('*'):\n                        try:\n                            if f.is_file():size+=f.stat().st_size\n                        except FileNotFoundError:pass\n                    peaks['temp']=max(peaks['temp'],size);assert size<=2147483648;last=time.monotonic()\n                time.sleep(.5)\n        except BaseException:\n            try:os.killpg(proc.pid,signal.SIGTERM)\n            except ProcessLookupError:pass\n            try:proc.wait(timeout=10)\n            except subprocess.TimeoutExpired:\n                os.killpg(proc.pid,signal.SIGKILL);proc.wait(timeout=10)\n            raise\n        if proc.returncode:raise subprocess.CalledProcessError(proc.returncode,cmd)\nm.admission=admission;m.gradle=run\n\ng=json.loads(r'''\"buildscript {\\n dependencies {\\n  classpath files((System.getenv('FGGUARD_CP') ?: '').split(File.pathSeparator))\\n  classpath gradleApi()\\n }\\n}\\nimport groovy.json.JsonOutput\\nimport java.net.*\\nimport java.security.MessageDigest\\nimport java.util.concurrent.atomic.AtomicInteger\\nimport com.sun.net.httpserver.HttpServer\\nimport com.sun.net.httpserver.HttpHandler\\nimport org.gradle.testfixtures.ProjectBuilder\\nimport net.minecraftforge.gradle.userdev.UserDevPlugin\\nimport net.minecraftforge.gradle.common.util.MavenArtifactDownloader\\n\\nclass LocalInputGuard extends ProxySelector {\\n final ProxySelector prior\\n final AtomicInteger blocked=new AtomicInteger()\\n LocalInputGuard(ProxySelector p) { prior=p }\\n List<Proxy> select(URI u) {\\n  if (['http','https'].contains(u.scheme) &&\\n      (u.path ?: '').toLowerCase(Locale.ROOT).contains('forge-1.12.2-14.23.5.2860-universal.jar')) {\\n   blocked.incrementAndGet()\\n   throw new SecurityException('Protected input remote access denied')\\n  }\\n  prior==null ? [Proxy.NO_PROXY] : prior.select(u)\\n }\\n void connectFailed(URI u,SocketAddress a,IOException e) {\\n  if (prior!=null) prior.connectFailed(u,a,e)\\n }\\n}\\ndef digest={ byte[] b -> MessageDigest.getInstance('SHA-256').digest(b).encodeHex().toString() }\\ndef fileHash={ File f ->\\n def md=MessageDigest.getInstance('SHA-256')\\n f.withInputStream { input -> byte[] b=new byte[1048576];int n;while ((n=input.read(b))!=-1) md.update(b,0,n) }\\n md.digest().encodeHex().toString()\\n}\\ntasks.register('qualifyGuard') {\\n doLast {\\n  def mode=project.property('case')\\n  assert ['control','valid','missing','corrupt','late-loss'].contains(mode)\\n  def base=project.projectDir.canonicalFile\\n  byte[] privateData='public synthetic local-input fixture\\\\n'.getBytes('UTF-8')\\n  byte[] publicData='public dependency control\\\\n'.getBytes('UTF-8')\\n  def expected=digest(privateData)\\n  def privateHits=new AtomicInteger()\\n  def publicHits=new AtomicInteger()\\n  def prior=ProxySelector.getDefault()\\n  def guard=new LocalInputGuard(prior)\\n  def result=[case:mode,fixtureOnly:true]\\n  def phase='listener'\\n  def server=HttpServer.create(new InetSocketAddress('127.0.0.1',0),0)\\n  try {\\n   server.createContext('/',{ ex ->\\n    def path=ex.requestURI.path\\n    byte[] body\\n    if (path.contains('forge-1.12.2-14.23.5.2860-universal.jar')) {\\n     privateHits.incrementAndGet();body=privateData\\n    } else { publicHits.incrementAndGet();body=publicData }\\n    if (path.endsWith('.md5')) body=MessageDigest.getInstance('MD5').digest(body).encodeHex().toString().getBytes('UTF-8')\\n    ex.sendResponseHeaders(200,body.length)\\n    ex.responseBody.withCloseable { it.write(body) }\\n    ex.close()\\n   } as HttpHandler)\\n   server.start()\\n   ProxySelector.setDefault(guard)\\n   phase='plugin-application'\\n   def fixtureDir=new File(base,'fixture');fixtureDir.mkdirs()\\n   def fixture=ProjectBuilder.builder().withName('guard-fixture').withProjectDir(fixtureDir).withGradleUserHomeDir(gradle.gradleUserHomeDir).build()\\n   fixture.pluginManager.apply(UserDevPlugin)\\n   assert fixture.plugins.hasPlugin(UserDevPlugin)\\n   assert fixture.extensions.findByName('minecraft')!=null\\n   result.pluginApplied=true\\n   assert ProxySelector.getDefault().is(guard)\\n   phase='mixed-repositories'\\n   def repo=new File(base,'local-repo');repo.mkdirs()\\n   fixture.repositories.clear()\\n   fixture.repositories.maven { url=repo.toURI() }\\n   fixture.repositories.maven { url=URI.create('http://127.0.0.1:'+server.address.port+'/') }\\n   assert fixture.repositories.size()==2 && fixture.repositories.first().url.scheme=='file'\\n   def relative='net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-universal.jar'\\n   def local=new File(repo,relative)\\n   if (mode!='missing') {\\n    local.parentFile.mkdirs()\\n    local.bytes=mode=='corrupt' ? 'corrupt public fixture'.getBytes('UTF-8') : privateData\\n    new File(local.path+'.md5').text=MessageDigest.getInstance('MD5').digest(local.bytes).encodeHex().toString()\\n   }\\n   def preflight={\\n    if (!local.isFile() || digest(local.bytes)!=expected) throw new IllegalStateException('LOCAL_INPUT_INVALID')\\n   }\\n   phase='case'\\n   if (mode=='control') {\\n    def c=new URL('https://repo.maven.apache.org/maven2/commons-io/commons-io/2.8.0/commons-io-2.8.0.jar').openConnection()\\n    c.connectTimeout=15000;c.readTimeout=15000;c.instanceFollowRedirects=false\\n    assert c.responseCode==200\\n    def out=new ByteArrayOutputStream()\\n    c.inputStream.withCloseable { input ->\\n     byte[] b=new byte[8192];int n\\n     while ((n=input.read(b))!=-1) { assert out.size()+n<=285424;out.write(b,0,n) }\\n    }\\n    assert out.size()==285424 && digest(out.toByteArray())=='02f291e5d1243dc143496e3cbbb40a1ced47aa58f2d633d3e38780cd068d5074'\\n    def pub=MavenArtifactDownloader.manual(fixture,'qualification.public:control:1@jar',false)\\n    assert pub!=null && digest(pub.bytes)==digest(publicData) && publicHits.get()>0\\n    try {\\n     new URL('https://127.0.0.1:'+server.address.port+'/'+local.name).openConnection().getInputStream()\\n     assert false\\n    } catch (SecurityException ok) { }\\n    assert guard.blocked.get()>0\\n    result.outcome='public-access-and-protected-https-guard-passed'\\n   } else if (mode in ['missing','corrupt']) {\\n    try { preflight();assert false } catch (IllegalStateException ok) { assert ok.message=='LOCAL_INPUT_INVALID' }\\n    assert guard.blocked.get()==0\\n    result.outcome=mode+'-rejected-before-consumer'\\n   } else {\\n    preflight()\\n    if (mode=='late-loss') { assert local.delete();assert new File(local.path+'.md5').delete() }\\n    File got=null\\n    try { got=MavenArtifactDownloader.manual(fixture,'net.minecraftforge:forge:1.12.2-14.23.5.2860:universal@jar',false) }\\n    catch (Exception e) { if (mode!='late-loss') throw e }\\n    if (mode=='valid') {\\n     assert got!=null && digest(got.bytes)==expected && guard.blocked.get()==0\\n     result.outcome='valid-local-accepted'\\n    } else {\\n     assert got==null && guard.blocked.get()>0\\n     result.outcome='post-check-loss-remote-fallback-blocked'\\n    }\\n   }\\n   assert privateHits.get()==0 && ProxySelector.getDefault().is(guard)\\n   if (mode=='control') {\\n    result.origins=[UserDevPlugin,MavenArtifactDownloader,ProjectBuilder,org.gradle.api.Project,com.google.gson.Gson,com.google.common.collect.ImmutableList,org.apache.commons.io.IOUtils].collect { cl ->\\n     def f=new File(cl.protectionDomain.codeSource.location.toURI())\\n     assert f.name ==~ /[A-Za-z0-9_.+-]+\\\\.jar/\\n     [className:cl.name,file:f.name,sha256:fileHash(f)]\\n    }\\n   }\\n  } catch (Throwable e) {\\n   result.failureStage=phase;result.errorClass=e.class.name\\n   result.causes=[]\\n   def c=e;int depth=0\\n   while (c!=null && depth++<4) { result.causes << c.class.name;c=c.cause }\\n   throw new GradleException('Guard fixture failed')\\n  } finally {\\n   result.guardBlocks=guard.blocked.get()\\n   result.protectedServerRequests=privateHits.get()\\n   result.publicServerRequests=publicHits.get()\\n   server.stop(0)\\n   ProxySelector.setDefault(prior)\\n   result.selectorRestored=(ProxySelector.getDefault()==prior)\\n   file('result.json').text=JsonOutput.toJson(result)\\n  }\\n }\\n}\\n\"''')\n\ntry:\n    m.prepare(p)\n    summaries=[];origins=None\n    for mode in ['control','valid','missing','corrupt','late-loss']:\n        phase=mode\n        cp=m.checked_cp(p)\n        project=p/('mixed-'+mode);project.mkdir()\n        (project/'settings.gradle').write_text(\"rootProject.name='mixed-repository-guard'\\n\")\n        (project/'build.gradle').write_text(g)\n        env=dict(os.environ,FGGUARD_CP=os.pathsep.join(cp))\n        try:\n            run(p,project,p/('mixed-home-'+mode),'qualifyGuard',('-Pcase='+mode,),env)\n        except subprocess.CalledProcessError:\n            status=project/'result.json'\n            if status.exists():print(json.dumps(json.loads(status.read_text()),sort_keys=True))\n            else:\n                text=(p/('guard-'+project.name+'.log')).read_text(errors='replace')\n                text=re.sub(r\"(?:[A-Za-z]:)?/[^\\s'\\\"<>]*\",'<path>',text)\n                print(text[-1800:])\n            raise\n        r=json.loads((project/'result.json').read_text())\n        assert r['pluginApplied'] and r['selectorRestored'] and r['protectedServerRequests']==0\n        if 'origins' in r:origins=r.pop('origins')\n        summaries.append(r)\n    report={'scope':'public synthetic plugin guard fixture; no main build','cases':summaries,'origins':origins,'peaks':peaks,'afterEvaluateExercised':False}\n    text=json.dumps(report,sort_keys=True)\n    assert len(text.encode())<=4096\n    assert not re.search(r'https?://|[A-Z]:\\\\',text,re.I)\n    assert os.environ['RUNNER_TEMP'] not in text and os.environ['GITHUB_WORKSPACE'] not in text\n    print(text)\nexcept Exception as error:\n    print(json.dumps({'scope':'public synthetic plugin guard fixture','failedPhase':phase,'errorClass':type(error).__name__,'peaks':peaks},sort_keys=True))\n    sys.exit(1)\n\nPY\n"
        },
        {
          "name": "Remove owned fixture inputs caches and logs",
          "if": "always() && steps.source.outcome == 'success'",
          "run": "python3 -B qualification/forge-input/runner.py cleanup"
        }
      ]
    }
  }
}
