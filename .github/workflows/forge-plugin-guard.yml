{
  "name": "Public Forge plugin instantiation diagnostic",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "expected_sha": {
          "description": "Exact reviewed source commit",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "forge-plugin-local-guard",
    "cancel-in-progress": false
  },
  "jobs": {
    "qualify": {
      "if": "github.repository == 'TroubledPerson/OpenComputersPlusPlus' && github.ref == 'refs/heads/ocpp-dev33' && github.event_name == 'workflow_dispatch' && github.actor_id == '89006981' && inputs.expected_sha == github.sha && github.workflow_sha == github.sha",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "id": "source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961",
          "with": {
            "distribution": "temurin",
            "java-version": "8"
          }
        },
        {
          "name": "Qualify public mixed-repository guard",
          "env": {
            "EXPECTED_SOURCE_SHA": "${{ inputs.expected_sha }}"
          },
          "run": "python3 -B - <<'PY'\nimport importlib.util,json,os,pathlib,re,shutil,signal,subprocess,sys,time\nassert os.environ.get('GITHUB_ACTIONS')=='true'\nassert os.environ.get('RUNNER_ENVIRONMENT')=='github-hosted'\nassert 'OCPP_FORGE_INPUT_URL' not in os.environ\nsha=os.environ['EXPECTED_SOURCE_SHA']\nassert re.fullmatch('[0-9a-f]{40}',sha) and sha==os.environ['GITHUB_SHA']\npath=pathlib.Path('qualification/forge-input/runner.py')\nimport hashlib\nassert hashlib.sha256(path.read_bytes()).hexdigest()=='19936c6ee14034ed50e39d4b6db009748a866c8d6815aa137f5fafd2ef10daff'\nspec=importlib.util.spec_from_file_location('qualified_tooling',path)\nm=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)\np=m.root();peaks={'rss':0,'temp':0};phase='public-preparation'\ndef admission():\n    info=dict(s.split(':',1) for s in pathlib.Path('/proc/meminfo').read_text().splitlines())\n    assert int(info['MemAvailable'].split()[0])*1024>=2147483648\n    assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free>=3221225472\ndef rss(pid):\n    seen=set();todo=[pid];total=0\n    while todo:\n        n=todo.pop()\n        if n in seen:continue\n        seen.add(n)\n        try:\n            fields=pathlib.Path('/proc/'+str(n)+'/status').read_text().splitlines()\n            total+=next((int(s.split()[1])*1024 for s in fields if s.startswith('VmRSS:')),0)\n            todo.extend(int(x) for x in pathlib.Path('/proc/'+str(n)+'/task/'+str(n)+'/children').read_text().split())\n        except (FileNotFoundError,ProcessLookupError):pass\n    return total\ndef run(root,project,home,task,extra=(),env=None):\n    admission()\n    log=root/('guard-'+project.name+'.log')\n    child=dict(os.environ if env is None else env,JAVA_OPTS='-Xmx64m')\n    cmd=[str(root/'gradle-7.6.6/bin/gradle'),'-p',str(project),'-g',str(home),'--no-daemon','--max-workers=1','--console=plain','--stacktrace','-Dorg.gradle.jvmargs=-Xmx512m',*extra,task]\n    with log.open('xb') as out:\n        proc=subprocess.Popen(cmd,env=child,stdout=out,stderr=subprocess.STDOUT,start_new_session=True)\n        deadline=time.monotonic()+240;last=0\n        try:\n            while proc.poll() is None:\n                used=rss(proc.pid);peaks['rss']=max(peaks['rss'],used)\n                info=dict(s.split(':',1) for s in pathlib.Path('/proc/meminfo').read_text().splitlines())\n                assert used<=1073741824 and int(info['MemAvailable'].split()[0])*1024>=1073741824\n                assert time.monotonic()<deadline\n                if time.monotonic()-last>2:\n                    size=0\n                    for f in root.rglob('*'):\n                        try:\n                            if f.is_file():size+=f.stat().st_size\n                        except FileNotFoundError:pass\n                    peaks['temp']=max(peaks['temp'],size);assert size<=2147483648;last=time.monotonic()\n                time.sleep(.5)\n        except BaseException:\n            try:os.killpg(proc.pid,signal.SIGTERM)\n            except ProcessLookupError:pass\n            try:proc.wait(timeout=10)\n            except subprocess.TimeoutExpired:\n                os.killpg(proc.pid,signal.SIGKILL);proc.wait(timeout=10)\n            raise\n        if proc.returncode:raise subprocess.CalledProcessError(proc.returncode,cmd)\n\nSAFE_WORDS=set('a an the of to for from with is not cannot could must be has have class interface constructor constructors public private protected argument arguments parameter parameters type types instance instantiate instantiation create creation generate generated abstract final static method methods inject injection ambiguous multiple no suitable found unsupported version major invalid expected actual incompatible duplicate visibility accessible access required service services'.split())\ndef safe_message(raw):\n    raw=raw[:2048]\n    raw=re.sub(r'[A-Za-z][A-Za-z0-9+.-]*://\\S+|(?:[A-Za-z]:)?[\\\\/]\\S+|[\\'\"][^\\'\"]*[\\'\"]',' REDACTED ',raw)\n    parts=[]\n    for word in re.findall(r'[A-Za-z]+|[^A-Za-z]+',raw):\n        if word.isalpha():parts.append(word.lower() if word.lower() in SAFE_WORDS else '<redacted>')\n        else:parts.append(re.sub(r'[^ \\t(),:]+','<redacted>',word))\n    return re.sub(r'(?:<redacted>\\s*)+','<redacted> ',''.join(parts))[:384]\ndef early_failure(log):\n    if not log.is_file():return {'category':'NO_RESULT_NO_LOG'}\n    with log.open('rb') as stream:\n        stream.seek(0,2);end=stream.tell();stream.seek(max(0,end-8192))\n        tail=stream.read(8192).decode('utf-8','replace')\n    tail=re.sub(r'\\x1b\\[[0-?]*[ -/]*[@-~]','',tail)\n    selected=[line for line in tail.splitlines() if line.startswith(('Caused by:','> '))]\n    return {'category':'NO_RESULT_EARLY_FAILURE','sanitizedMessages':[safe_message(line) for line in selected[-4:]],'tailWasBounded':end>8192}\n\nm.admission=admission;m.gradle=run\n\ng=json.loads(r'''\"buildscript {\\n dependencies {\\n  classpath files((System.getenv('FGGUARD_CP') ?: '').split(File.pathSeparator))\\n  classpath gradleApi()\\n }\\n}\\nimport groovy.json.JsonOutput\\nimport java.net.*\\nimport java.security.MessageDigest\\nimport java.util.concurrent.atomic.AtomicInteger\\nimport com.sun.net.httpserver.HttpServer\\nimport com.sun.net.httpserver.HttpHandler\\nimport org.gradle.testfixtures.ProjectBuilder\\nimport net.minecraftforge.gradle.userdev.UserDevPlugin\\nimport net.minecraftforge.gradle.common.util.MavenArtifactDownloader\\n\\nclass LocalInputGuard extends ProxySelector {\\n final ProxySelector prior\\n final AtomicInteger blocked=new AtomicInteger()\\n LocalInputGuard(ProxySelector p) { prior=p }\\n List<Proxy> select(URI u) {\\n  if (['http','https'].contains(u.scheme) &&\\n      (u.path ?: '').toLowerCase(Locale.ROOT).contains('forge-1.12.2-14.23.5.2860-universal.jar')) {\\n   blocked.incrementAndGet()\\n   throw new SecurityException('Protected input remote access denied')\\n  }\\n  prior==null ? [Proxy.NO_PROXY] : prior.select(u)\\n }\\n void connectFailed(URI u,SocketAddress a,IOException e) {\\n  if (prior!=null) prior.connectFailed(u,a,e)\\n }\\n}\\ndef digest={ byte[] b -> MessageDigest.getInstance('SHA-256').digest(b).encodeHex().toString() }\\ndef fileHash={ File f ->\\n def md=MessageDigest.getInstance('SHA-256')\\n f.withInputStream { input -> byte[] b=new byte[1048576];int n;while ((n=input.read(b))!=-1) md.update(b,0,n) }\\n md.digest().encodeHex().toString()\\n}\\n\\nclass SafeDiagnostic {\\n static final List<String> NAMES=[\\n  'net.minecraftforge.gradle.userdev.UserDevPlugin',\\n  'org.gradle.api.Project','org.gradle.testfixtures.ProjectBuilder',\\n  'org.gradle.api.internal.plugins.DefaultPluginManager',\\n  'org.gradle.internal.instantiation.InstantiatorFactory',\\n  'org.gradle.internal.reflect.Instantiator',\\n  'org.gradle.internal.instantiation.DefaultInstantiatorFactory',\\n  'org.gradle.internal.instantiation.generator.AbstractClassGenerator',\\n  'org.gradle.internal.instantiation.generator.DependencyInjectingInstantiator',\\n  'org.gradle.internal.instantiation.generator.Jsr330ConstructorSelector',\\n  'org.gradle.internal.instantiation.generator.AsmBackedClassGenerator']\\n static final Set<String> WORDS=('a an the of to for from with is not cannot could must be has have class interface constructor constructors public private protected argument arguments parameter parameters type types instance instantiate instantiation create creation generate generated abstract final static method methods inject injection ambiguous multiple no suitable found unsupported version major invalid expected actual incompatible duplicate visibility accessible access required service services').split(' ') as Set\\n static final Set<String> METHODS=['newInstance','instantiatePlugin','producePluginInstance','generate','generateClass','construct','select','apply','getDeclaredConstructor','<init>'] as Set\\n static String category(String s) {\\n  s=(s ?: '').take(2048).toLowerCase(Locale.ROOT)\\n  if (s.contains('unsupported') && s.contains('version')) return 'UNSUPPORTED_VERSION'\\n  if (s.contains('constructor')) return 'CONSTRUCTOR_SELECTION'\\n  if (s.contains('inject') || s.contains('service')) return 'INJECTION'\\n  if (s.contains('class') || s.contains('generat')) return 'TYPE_OR_GENERATION'\\n  'UNCLASSIFIED'\\n }\\n static String message(String raw) {\\n  def bounded=(raw ?: '').take(2048)\\n   .replaceAll(/[A-Za-z][A-Za-z0-9+.-]*:\\\\/\\\\/[^\\\\s]+/,' REDACTED ')\\n   .replaceAll(/(?:[A-Za-z]:)?[\\\\\\\\\\\\/][^\\\\s]+/,' REDACTED ')\\n   .replaceAll(/['\\\\\\\"][^'\\\\\\\"]*['\\\\\\\"]/,' REDACTED ')\\n  def tokens=(bounded =~ /[A-Za-z]+|[^A-Za-z]+/)\\n  def out=new StringBuilder()\\n  tokens.each { item ->\\n   String s=item.toString()\\n   if (s ==~ /[A-Za-z]+/) out.append(WORDS.contains(s.toLowerCase(Locale.ROOT)) ? s.toLowerCase(Locale.ROOT) : '<redacted>')\\n   else out.append(s.replaceAll(/[^ \\\\t(),:]/,'#').replaceAll(/#+/,'<redacted>'))\\n  }\\n  out.toString().replaceAll(/(?:<redacted>\\\\s*)+/,'<redacted> ').take(384)\\n }\\n static Map error(Throwable t) {\\n  def seen=Collections.newSetFromMap(new IdentityHashMap())\\n  def root=t;int n=0\\n  while (root.cause!=null && n++<8 && seen.add(root)) root=root.cause\\n  [category:category(root.message),message:message(root.message),\\n   causeWalkBounded:(n>=8 || root.cause!=null),\\n   stack:root.stackTrace.take(6).collect { f ->\\n    [type:NAMES.contains(f.className) ? f.className : 'other',\\n     method:METHODS.contains(f.methodName) ? f.methodName : 'other',\\n     line:(f.lineNumber>=0 && f.lineNumber<=100000 ? f.lineNumber : -1)]\\n   }]\\n }\\n final IdentityHashMap<ClassLoader,String> ids=new IdentityHashMap<>()\\n final Map<String,String> hashes=[:]\\n String id(ClassLoader cl) {\\n  if (cl==null) return 'bootstrap'\\n  if (!ids.containsKey(cl)) ids.put(cl,'L'+(ids.size()+1))\\n  ids.get(cl)\\n }\\n Map origin(Class cl) {\\n  def chain=[];def loader=cl.classLoader\\n  for (int n=0;loader!=null && n<4;n++) {\\n   chain << [id:id(loader),kind:(loader instanceof URLClassLoader ? 'url-loader' : 'other')]\\n   loader=loader.parent\\n  }\\n  def out=[type:cl.name,loader:id(cl.classLoader),parents:chain,parentChainTruncated:loader!=null]\\n  def location=cl.protectionDomain?.codeSource?.location\\n  out.origin='unavailable'\\n  if (location?.protocol=='file') {\\n   def f=new File(location.toURI())\\n   if (f.isFile() && f.length()<=134217728) {\\n    String key=f.canonicalPath\\n    if (!hashes.containsKey(key)) {\\n     def md=MessageDigest.getInstance('SHA-256')\\n     f.withInputStream { input -> byte[] b=new byte[8192];int n;while((n=input.read(b))!=-1) md.update(b,0,n) }\\n     hashes[key]=md.digest().encodeHex().toString()\\n    }\\n    out.origin='jar';out.sha256=hashes[key]\\n   } else out.origin=f.isDirectory() ? 'directory' : 'unhashed-file'\\n  }\\n  out\\n }\\n List snapshot() {\\n  NAMES.collect { name ->\\n   try {\\n    def loader=name.startsWith('net.minecraftforge.') ? UserDevPlugin.classLoader : ProjectBuilder.classLoader\\n    origin(Class.forName(name,false,loader))\\n   } catch (Throwable ignored) { [type:name,origin:'unavailable'] }\\n  }\\n }\\n}\\n\\ntasks.register('qualifyGuard') {\\n doLast {\\n  def mode=project.property('case')\\n  assert ['control','valid','missing','corrupt','late-loss'].contains(mode)\\n  def base=project.projectDir.canonicalFile\\n  byte[] privateData='public synthetic local-input fixture\\\\n'.getBytes('UTF-8')\\n  byte[] publicData='public dependency control\\\\n'.getBytes('UTF-8')\\n  def expected=digest(privateData)\\n  def privateHits=new AtomicInteger()\\n  def publicHits=new AtomicInteger()\\n  def prior=ProxySelector.getDefault()\\n  def guard=new LocalInputGuard(prior)\\n  def result=[case:mode,fixtureOnly:true]\\n  def phase='listener'\\n  def diagnostic=new SafeDiagnostic()\\n  def server=HttpServer.create(new InetSocketAddress('127.0.0.1',0),0)\\n  try {\\n   server.createContext('/',{ ex ->\\n    def path=ex.requestURI.path\\n    byte[] body\\n    if (path.contains('forge-1.12.2-14.23.5.2860-universal.jar')) {\\n     privateHits.incrementAndGet();body=privateData\\n    } else { publicHits.incrementAndGet();body=publicData }\\n    if (path.endsWith('.md5')) body=MessageDigest.getInstance('MD5').digest(body).encodeHex().toString().getBytes('UTF-8')\\n    ex.sendResponseHeaders(200,body.length)\\n    ex.responseBody.withCloseable { it.write(body) }\\n    ex.close()\\n   } as HttpHandler)\\n   server.start()\\n   ProxySelector.setDefault(guard)\\n   phase='pre-application-origins'\\n   result.preApplicationOrigins=diagnostic.snapshot()\\n   phase='plugin-application'\\n   def fixtureDir=new File(base,'fixture');fixtureDir.mkdirs()\\n   def fixture=ProjectBuilder.builder().withName('guard-fixture').withProjectDir(fixtureDir).withGradleUserHomeDir(gradle.gradleUserHomeDir).build()\\n   result.fixtureManager=[expectedType:(fixture.pluginManager.class.name=='org.gradle.api.internal.plugins.DefaultPluginManager'),loader:diagnostic.id(fixture.pluginManager.class.classLoader)]\\n   fixture.pluginManager.apply(UserDevPlugin)\\n   assert fixture.plugins.hasPlugin(UserDevPlugin)\\n   assert fixture.extensions.findByName('minecraft')!=null\\n   result.pluginApplied=true\\n   assert ProxySelector.getDefault().is(guard)\\n   result.outcome='plugin-application-diagnostic-only'\\n  } catch (Throwable e) {\\n   result.failureStage=phase;result.errorClass=e.class.name\\n   try { result.rootDiagnostic=SafeDiagnostic.error(e) }\\n   catch (Throwable ignored) { result.rootDiagnostic=[category:'CAPTURE_FAILED'] }\\n   result.causes=[]\\n   def c=e;int depth=0\\n   while (c!=null && depth++<4) { result.causes << c.class.name;c=c.cause }\\n   throw new GradleException('Guard fixture failed')\\n  } finally {\\n   result.guardBlocks=guard.blocked.get()\\n   result.protectedServerRequests=privateHits.get()\\n   result.publicServerRequests=publicHits.get()\\n   server.stop(0)\\n   ProxySelector.setDefault(prior)\\n   result.selectorRestored=(ProxySelector.getDefault()==prior)\\n   file('result.json').text=JsonOutput.toJson(result)\\n  }\\n }\\n}\\n\"''')\n\ntry:\n    m.prepare(p)\n    summaries=[];origins=None\n    for mode in ['control']:\n        phase=mode\n        cp=m.checked_cp(p)\n        project=p/('mixed-'+mode);project.mkdir()\n        (project/'settings.gradle').write_text(\"rootProject.name='mixed-repository-guard'\\n\")\n        (project/'build.gradle').write_text(g)\n        env=dict(os.environ,FGGUARD_CP=os.pathsep.join(cp))\n        try:\n            run(p,project,p/('mixed-home-'+mode),'qualifyGuard',('-Pcase='+mode,),env)\n        except subprocess.CalledProcessError:\n            status=project/'result.json'\n            try:\n                assert status.is_file() and status.stat().st_size<=16384\n                payload=json.loads(status.read_text())\n                assert isinstance(payload,dict)\n                rendered=json.dumps(payload,sort_keys=True)\n                assert len(rendered.encode())<=16384\n                assert not re.search(r'https?://|[A-Z]:\\\\',rendered,re.I)\n                assert os.environ['RUNNER_TEMP'] not in rendered and os.environ['GITHUB_WORKSPACE'] not in rendered\n                print(rendered)\n            except (AssertionError,OSError,UnicodeError,ValueError):\n                print(json.dumps(early_failure(p/('guard-'+project.name+'.log')),sort_keys=True))\n            raise\n        r=json.loads((project/'result.json').read_text())\n        assert r['pluginApplied'] and r['selectorRestored'] and r['protectedServerRequests']==0\n        if 'origins' in r:origins=r.pop('origins')\n        summaries.append(r)\n    report={'scope':'public synthetic plugin guard fixture; no main build','cases':summaries,'origins':origins,'peaks':peaks,'afterEvaluateExercised':False}\n    text=json.dumps(report,sort_keys=True)\n    assert len(text.encode())<=16384\n    assert not re.search(r'https?://|[A-Z]:\\\\',text,re.I)\n    assert os.environ['RUNNER_TEMP'] not in text and os.environ['GITHUB_WORKSPACE'] not in text\n    print(text)\nexcept Exception as error:\n    print(json.dumps({'scope':'public synthetic plugin guard fixture','failedPhase':phase,'errorClass':type(error).__name__,'peaks':peaks},sort_keys=True))\n    sys.exit(1)\n\nPY\n"
        },
        {
          "name": "Remove owned fixture inputs caches and logs",
          "if": "always() && steps.source.outcome == 'success'",
          "run": "python3 -B qualification/forge-input/runner.py cleanup"
        }
      ]
    }
  }
}
